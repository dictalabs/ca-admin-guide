site_name: CA Admin Guide
theme:
  name: material
  theme_dir: docs/custom_theme
  logo: images/logo.png
  favicon: images/favicon.png

extra_css:
  - extra.css

extra:
  generator: false  # This disables the "Made with Material for MkDocs" footer
  footer: "© 2026 Dictalabs. All rights reserved."

extra_javascript:
  - extra.js

copyright: "© 2026 Dictalabs. All rights reserved."

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

